<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro de pacientes</title>

    <style>
      /* Diseño general */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0fdfa;
        color: #1e293b;
      }

      /* Encabezado */
      header {
        background-color: #0f766e;
        color: white;
        padding: 20px;
        text-align: center;
      }

      header h1 {
        margin: 0 0 8px;
      }

      header p {
        margin: 0;
      }

      /* Contenedor del formulario */
      main {
        width: 90%;
        max-width: 650px;
        margin: 35px auto;
      }

      .tarjeta {
        background-color: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(15, 118, 110, 0.12);
      }

      .tarjeta h2 {
        color: #0f766e;
        text-align: center;
        margin-top: 0;
      }

      .descripcion {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
      }

      /* Campos del formulario */
      .grupo {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #0f766e;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
      }

      /* Botón */
      button {
        width: 100%;
        padding: 13px;
        background-color: #0f766e;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background-color: #115e59;
      }

      button:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
      }

      /* Mensajes */
      #mensaje {
        text-align: center;
        font-weight: bold;
        margin-top: 18px;
      }

      .enlace {
        text-align: center;
        margin-top: 22px;
      }

      a {
        color: #0f766e;
        font-weight: bold;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        color: #64748b;
        padding: 20px;
      }

      /* Adaptación a celulares */
      @media (max-width: 480px) {
        .tarjeta {
          padding: 22px;
        }

        header h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Centro Médico</h1>
      <p>Sistema de gestión de citas médicas</p>
    </header>

    <main>
      <section class="tarjeta">
        <h2>Registro de pacientes</h2>

        <p class="descripcion">
          Completa tus datos para registrarte en el sistema.
        </p>

        <form id="formRegistro">
          <div class="grupo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" maxlength="100" required />
          </div>

          <div class="grupo">
            <label for="documento">Número de documento</label>
            <input type="text" id="documento" maxlength="20" required />
          </div>

          <div class="grupo">
            <label for="fecha_nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha_nacimiento" required />
          </div>

          <div class="grupo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" maxlength="20" required />
          </div>

          <div class="grupo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" maxlength="100" required />
          </div>

          <div class="grupo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="8" required />
          </div>

          <button type="submit" id="btnRegistrar">Registrar paciente</button>

          <p id="mensaje" role="status" aria-live="polite"></p>
        </form>

        <p class="enlace">
          ¿Ya tienes una cuenta?
          <a href="login.html">Inicia sesión</a>
        </p>

        <p class="enlace">
          <a href="index.html">Volver al inicio</a>
        </p>
      </section>
    </main>

    <footer>
      <p>Proyecto académico de gestión de citas médicas</p>
    </footer>

    <script>
      // Capturar el formulario y los elementos necesarios
      const formulario = document.getElementById("formRegistro");
      const mensaje = document.getElementById("mensaje");
      const btnRegistrar = document.getElementById("btnRegistrar");

      // Enviar los datos cuando se registra un paciente
      formulario.addEventListener("submit", async function (evento) {
        evento.preventDefault();

        // Obtener los datos ingresados
        const paciente = {
          nombre: document.getElementById("nombre").value.trim(),
          documento: document.getElementById("documento").value.trim(),
          fecha_nacimiento: document.getElementById("fecha_nacimiento").value,
          telefono: document.getElementById("telefono").value.trim(),
          correo: document.getElementById("correo").value.trim(),
          password: document.getElementById("password").value,
        };

        // Evitar envíos repetidos mientras se procesa la solicitud
        btnRegistrar.disabled = true;
        btnRegistrar.textContent = "Registrando...";
        mensaje.textContent = "";

        try {
          // Enviar los datos al backend
          const respuesta = await fetch("/api/pacientes", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(paciente),
          });

          const datos = await respuesta.json();

          if (respuesta.ok) {
            mensaje.textContent = datos.mensaje;
            mensaje.style.color = "#15803d";

            formulario.reset();
          } else {
            mensaje.textContent =
              datos.mensaje || "No se pudo registrar el paciente";

            mensaje.style.color = "#b91c1c";
          }
        } catch (error) {
          console.error(error);

          mensaje.textContent = "No se pudo conectar con el servidor";

          mensaje.style.color = "#b91c1c";
        } finally {
          // Volver a habilitar el botón
          btnRegistrar.disabled = false;
          btnRegistrar.textContent = "Registrar paciente";
        }
      });
    </script>
  </body>
</html>
