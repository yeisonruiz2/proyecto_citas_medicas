<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inicio de sesión</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f0fdfa;
        color: #1e293b;
      }

      header {
        background-color: #0f766e;
        color: white;
        padding: 25px 15px;
        text-align: center;
      }

      header h1 {
        margin: 0 0 8px;
      }

      header p {
        margin: 0;
      }

      main {
        width: 90%;
        max-width: 450px;
        margin: 45px auto;
      }

      .tarjeta {
        background-color: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(15, 118, 110, 0.12);
      }

      h2 {
        color: #0f766e;
        text-align: center;
        margin-top: 0;
      }

      .descripcion {
        color: #64748b;
        text-align: center;
        margin-bottom: 25px;
      }

      .grupo {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #0f766e;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
      }

      button {
        width: 100%;
        padding: 13px;
        background-color: #0f766e;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background-color: #115e59;
      }

      button:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
      }

      #mensaje {
        text-align: center;
        font-weight: bold;
        margin-top: 18px;
      }

      .enlace {
        text-align: center;
        margin-top: 22px;
      }

      a {
        color: #0f766e;
        font-weight: bold;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      footer {
        text-align: center;
        color: #64748b;
        padding: 20px;
      }

      @media (max-width: 480px) {
        .tarjeta {
          padding: 22px;
        }

        header h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Centro Médico</h1>
      <p>Sistema de gestión de citas médicas</p>
    </header>

    <main>
      <section class="tarjeta">
        <h2>Bienvenido</h2>

        <p class="descripcion">Ingresa tus datos para acceder al sistema.</p>

        <form id="formLogin">
          <div class="grupo">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              maxlength="100"
              autocomplete="username"
              required
            />
          </div>

          <div class="grupo">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" id="btnIngresar">Iniciar sesión</button>

          <p id="mensaje" role="status" aria-live="polite"></p>
        </form>

        <p class="enlace">
          ¿No tienes una cuenta?
          <a href="registro.html">Regístrate aquí</a>
        </p>

        <p class="enlace">
          <a href="index.html">Volver al inicio</a>
        </p>
      </section>
    </main>

    <footer>
      <p>Proyecto académico de gestión de citas médicas</p>
    </footer>

    <script>
      // Capturar los elementos del formulario
      const formulario = document.getElementById("formLogin");
      const mensaje = document.getElementById("mensaje");
      const btnIngresar = document.getElementById("btnIngresar");

      // Procesar el inicio de sesión
      formulario.addEventListener("submit", async function (evento) {
        evento.preventDefault();

        const correo = document.getElementById("correo").value.trim();
        const password = document.getElementById("password").value;

        btnIngresar.disabled = true;
        btnIngresar.textContent = "Verificando...";
        mensaje.textContent = "";

        try {
          // Enviar las credenciales al backend
          const respuesta = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              correo: correo,
              password: password,
            }),
          });

          const datos = await respuesta.json();

          if (respuesta.ok) {
            // Guardar el nombre para mostrar el saludo
            sessionStorage.setItem("nombrePaciente", datos.paciente.nombre);
            sessionStorage.setItem("token", datos.token);

            // Ir a la página principal
            window.location.href = "index.html";
          } else {
            mensaje.textContent = datos.mensaje || "No se pudo iniciar sesión";

            mensaje.style.color = "#b91c1c";
          }
        } catch (error) {
          console.error(error);

          mensaje.textContent = "No se pudo conectar con el servidor";

          mensaje.style.color = "#b91c1c";
        } finally {
          btnIngresar.disabled = false;
          btnIngresar.textContent = "Iniciar sesión";
        }
      });
    </script>
  </body>
</html>
